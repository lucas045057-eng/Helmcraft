services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: .env
    volumes:
      - ./data:/data
      - ./hub.yaml:/app/hub.yaml:ro
    expose: ["8080"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [hub]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.60.0/24
