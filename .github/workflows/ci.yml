name: CI
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm lint
      - run: pnpm depcheck
      - run: pnpm test --maxWorkers=2
        env:
          # The Windows runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...). Tests that build a
          # Worker config straight from tmpdir() would then trip the "workspace root changed" guard, which
          # production avoids by canonicalising paths in loadWorkerConfig. Use the runner's long-path temp dir.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
